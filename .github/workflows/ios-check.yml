# Checks the iOS port without any game files: builds the patched ReXGlue SDK for iOS with Xcode,
# compiles the app-side iOS sources against it, and runs the touch pad's desktop test.
# (The game itself cannot be built here: it needs code generated from a personal copy.)
name: iOS check

on:
  workflow_dispatch:
  push:
    paths:
      - 'patches/**'
      - 'game/**'
      - '.github/workflows/ios-check.yml'

permissions:
  contents: read

env:
  SDK_REV: 546a082
  BASE_PATCH: patches/nobk-sdk-1.3.0.patch
  APP_SRC: game/src
  APP_HEADER: fifa09_app.h
  TOUCH_DEFINE: FIFA09_TOUCH

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          brew install ninja || true
          xcodebuild -version
          clang++ --version
          cmake --version

      - name: ReXGlue SDK + patches
        run: |
          git clone https://github.com/rexglue/rexglue-sdk.git "$RUNNER_TEMP/sdk"
          cd "$RUNNER_TEMP/sdk"
          git checkout "$SDK_REV"
          git submodule update --init --recursive --depth 1
          git apply "$GITHUB_WORKSPACE/$BASE_PATCH"
          git apply "$GITHUB_WORKSPACE/patches/rexglue-ios.patch"

      - name: Touch pad test (host)
        run: |
          S="$RUNNER_TEMP/sdk"
          cd "$APP_SRC/ios"
          clang++ -std=c++23 -O1 -DFMT_HEADER_ONLY -I"$S/include" -I"$S/thirdparty/fmt/include" \
            -I"$S/thirdparty/spdlog/include" -I"$S/thirdparty/imgui" -I"$S/thirdparty/sdl3/include" \
            -I"$S/thirdparty/xxHash" -I"$S/thirdparty/simde" touch_pad_test.cpp \
            "$S"/thirdparty/imgui/imgui.cpp "$S"/thirdparty/imgui/imgui_draw.cpp \
            "$S"/thirdparty/imgui/imgui_tables.cpp "$S"/thirdparty/imgui/imgui_widgets.cpp \
            -o "$RUNNER_TEMP/touch_pad_test"
          "$RUNNER_TEMP/touch_pad_test"

      - name: App sources for iOS (syntax)
        run: |
          S="$RUNNER_TEMP/sdk"
          INC="-I$S/include -I$S/thirdparty/fmt/include -I$S/thirdparty/spdlog/include -I$S/thirdparty/imgui -I$S/thirdparty/sdl3/include -I$S/thirdparty/xxHash -I$S/thirdparty/simde"
          CXX="xcrun -sdk iphoneos clang++ -target arm64-apple-ios17.0 -std=c++23 -fsyntax-only"
          cd "$APP_SRC"
          $CXX -fobjc-arc ios/display_link.mm
          $CXX $INC ios/touch_pad.cpp
          printf '#include <rex/rex_app.h>\nstatic const rex::PPCImageInfo PPCImageConfig{};\n#include "%s"\n' "$APP_HEADER" > "$RUNNER_TEMP/app_check.cpp"
          $CXX $INC -I. -D$TOUCH_DEFINE=1 "$RUNNER_TEMP/app_check.cpp"

      - name: SDK for iOS (configure)
        run: |
          cd "$RUNNER_TEMP/sdk"
          cmake -S . -B out/build/ios-arm64 -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_FLAGS=-mcpu=apple-a14 -DCMAKE_CXX_FLAGS=-mcpu=apple-a14 -DCMAKE_CXX_STANDARD=23 \
            -DREXGLUE_ENABLE_TRACY=OFF -DCMAKE_INSTALL_PREFIX="$PWD/out/install/ios-arm64"

      - name: SDK for iOS (build)
        run: |
          cd "$RUNNER_TEMP/sdk"
          ninja -C out/build/ios-arm64
          cmake --install out/build/ios-arm64
          ls -la out/install/ios-arm64/lib | head -40
          file out/install/ios-arm64/lib/librexruntime.dylib
